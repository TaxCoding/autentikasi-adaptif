<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Rekomendasi Autentikasi — Dialog Game</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="viewport-wrapper">
    <section class="game-frame" aria-label="Dialog Game Rekomendasi Autentikasi">
      <!-- Background Image -->
      <div class="bg-layer" role="img" aria-label="Latar belakang karakter King"></div>
      <div class="bg-vignette"></div>

      <!-- TOP HUD: Progress Evaluasi & Simbol Proposisi -->
      <header class="top-hud" id="top-hud">
        <!-- Baris 1: Progress Evaluasi -->
        <div class="progress-card">
          <div class="progress-header">
            <span class="progress-title">PROGRESS EVALUASI</span>
            <span class="progress-counter" id="progress-counter">Prolog • 0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track">
            <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
          </div>
          <div class="device-status-row">
            <span class="device-label">Perangkat:</span>
            <span class="device-value" id="hud-device">Belum dipilih</span>
          </div>
        </div>

        <!-- Baris 2: Simbol Proposisi Input (H, U, S, K) + Nilai B / T di bawahnya -->
        <div class="propositions-section">
          <div class="prop-grid" aria-label="Status Proposisi Input">
            <div class="prop-item" id="prop-card-H" title="H: Risiko akses tinggi (risikoTinggi)">
              <div class="prop-symbol-box">
                <span class="prop-symbol">H</span>
                <span class="prop-sub">Risiko</span>
              </div>
              <div class="prop-truth pending" id="truth-H" aria-label="Nilai proposisi H">?</div>
            </div>

            <div class="prop-item" id="prop-card-U" title="U: Perangkat tidak dikenal (perangkatTidakDikenal)">
              <div class="prop-symbol-box">
                <span class="prop-symbol">U</span>
                <span class="prop-sub">Asing</span>
              </div>
              <div class="prop-truth pending" id="truth-U" aria-label="Nilai proposisi U">?</div>
            </div>

            <div class="prop-item" id="prop-card-S" title="S: Mengakses data sensitif (aksesSensitif)">
              <div class="prop-symbol-box">
                <span class="prop-symbol">S</span>
                <span class="prop-sub">Sensitif</span>
              </div>
              <div class="prop-truth pending" id="truth-S" aria-label="Nilai proposisi S">?</div>
            </div>

            <div class="prop-item" id="prop-card-K" title="K: (jenisPerangkat != 4) && mendukungPasskey">
              <div class="prop-symbol-box">
                <span class="prop-symbol">K</span>
                <span class="prop-sub">Passkey</span>
              </div>
              <div class="prop-truth pending" id="truth-K" aria-label="Nilai proposisi K">?</div>
            </div>
          </div>

          <!-- Baris 3: Evaluasi Rumus Proposisi Output (M, B, P) -->
          <div class="derived-grid" aria-label="Evaluasi Proposisi Output">
            <div class="derived-item" id="derived-M" title="M = H || U || S (Multi-Factor Authentication)">
              <span class="derived-formula">M = H ∨ U ∨ S</span>
              <span class="derived-truth pending" id="truth-M">?</span>
            </div>
            <div class="derived-item" id="derived-B" title="B = !M && K (Passkey)">
              <span class="derived-formula">B = ¬M ∧ K</span>
              <span class="derived-truth pending" id="truth-B">?</span>
            </div>
            <div class="derived-item" id="derived-P" title="P = !M && !K (Password)">
              <span class="derived-formula">P = ¬M ∧ ¬K</span>
              <span class="derived-truth pending" id="truth-P">?</span>
            </div>
          </div>

          <div class="legend-strip">
            <span><strong class="legend-b">B</strong> = Benar (True)</span>
            <span>•</span>
            <span><strong class="legend-t">T</strong> = Tidak (False)</span>
          </div>
        </div>
      </header>

      <!-- RESULT OVERLAY (Muncul saat evaluasi selesai) -->
      <section class="result-panel hidden" id="result-panel" aria-live="polite">
        <div class="result-header">
          <span class="result-tag">HASIL EVALUASI LOGIKA</span>
          <h2 class="result-method" id="result-method">-</h2>
        </div>

        <div class="result-body" id="result-body">
          <!-- Diisi secara dinamis oleh js/dialog.js -->
        </div>

        <div class="result-actions">
          <button type="button" class="btn-restart" id="btn-restart">
            ↻ Evaluasi Ulang
          </button>
        </div>
      </section>

      <!-- BOTTOM VISUAL NOVEL DIALOG BOX -->
      <section class="dialog-box" id="dialog-box" aria-live="polite">
        <div class="speaker-badge" id="speaker-badge">King lelouch</div>

        <div class="dialog-content" id="dialog-content" title="Klik untuk mempercepat teks">
          <p class="dialog-text" id="dialog-text"></p>
          <span class="typing-cursor" id="typing-cursor" aria-hidden="true">▌</span>
        </div>

        <div class="choices-list" id="choices-list" role="group" aria-label="Pilihan Jawaban">
          <!-- Tombol pilihan dirender secara dinamis -->
        </div>
      </section>
    </section>
  </main>

  <script src="js/logic.js"></script>
  <script src="js/dialog.js"></script>
</body>
</html>
